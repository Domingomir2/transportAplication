spring.application.name=transportApplication
spring.mvc.async.request-timeout=60m
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}

# BIDEA Oracle is optional. Set BIDEA_DATASOURCE_URL,
# BIDEA_DATASOURCE_USERNAME and BIDEA_DATASOURCE_PASSWORD as environment variables.
bidea.datasource.url=jdbc:oracle:thin:@10.100.18.157:1521/FORBID
bidea.datasource.username="TRAFICO"
bidea.datasource.password="alertran"

# --- TRAZAS HACIA JAEGER (Spring Boot 4.x) ---
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.endpoints.web.exposure.include=health,prometheus
management.defaults.metrics.export.enabled=false
management.prometheus.metrics.export.enabled=true
# Usa W3C por defecto en lugar de B3, o soporta ambos limpiamente
management.tracing.propagation.type=W3C

# Desactiva métricas OTLP si no tienes un Collector; Prometheus queda activo
management.opentelemetry.metrics.export.otlp.enabled=false

logging.level.io.opentelemetry=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Ruta donde se guardará el archivo de log (se crea la carpeta automáticamente)
logging.file.name=logs/transport-application.log

# Mantener el mismo formato que en consola incluyendo traceId y spanId
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}] --- [%15.15t] %-40.40logger{39} : %m%n

# Rotación básica para no llenar el disco
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=7


