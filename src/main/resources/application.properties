spring.application.name=transportApplication

# BIDEA Oracle is optional. Set BIDEA_DATASOURCE_URL,
# BIDEA_DATASOURCE_USERNAME and BIDEA_DATASOURCE_PASSWORD as environment variables.
bidea.datasource.url=jdbc:oracle:thin:@10.100.18.157:1521/FORBID
bidea.datasource.username="TRAFICO"
bidea.datasource.password="alertran"

# Métricas Micrometer exportadas por OTLP/HTTP al Collector OpenTelemetry.
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=${OTEL_METRIC_EXPORT_INTERVAL:60s}
management.opentelemetry.resource-attributes[service.name]=${spring.application.name}

otel.service.name=${spring.application.name}
otel.exporter.otlp.endpoint=http://localhost:4317
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.logs.exporter=none

# Expone únicamente health; no publicar otros endpoints de gestión por defecto.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always

management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}