spring.application.name=transportApplication
app.cors.allowed-origin=${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}

# BIDEA Oracle is optional. Set BIDEA_DATASOURCE_URL,
# BIDEA_DATASOURCE_USERNAME and BIDEA_DATASOURCE_PASSWORD as environment variables.
bidea.datasource.url=jdbc:oracle:thin:@10.100.18.157:1521/FORBID
bidea.datasource.username="TRAFICO"
bidea.datasource.password="alertran"

# --- TRAZAS HACIA JAEGER (Spring Boot 4.x) ---
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.opentelemetry.resource-attributes.service.name=${spring.application.name}
management.defaults.metrics.export.enabled=false

# Desactiva métricas OTLP si no tienes un Collector (deja Prometheus activo)
management.opentelemetry.metrics.export.otlp.enabled=false

logging.level.io.opentelemetry=DEBUG
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

